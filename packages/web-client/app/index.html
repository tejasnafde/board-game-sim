<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Game Sim</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Manrope:wght@400;500;700;800&display=swap");

      :root {
        --bg-0: #f2f7fa;
        --bg-1: #d6e6ee;
        --ink: #102330;
        --ink-soft: #546876;
        --line: #bdd0de;
        --card: #ffffffeb;
        --nav: #0e2b3f;
        --nav-ink: #e8f4fb;
        --primary: #0f7aa7;
        --primary-strong: #086184;
        --secondary: #dcecf6;
        --danger: #bb3550;
        --radius-lg: 20px;
        --radius-md: 12px;
        --radius-sm: 8px;
        --space-1: 8px;
        --space-2: 12px;
        --space-3: 16px;
        --space-4: 24px;
        --space-5: 32px;
        --shadow-xl: 0 18px 44px #153a5324;
        --shadow-md: 0 8px 22px #153a5317;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Manrope", "Avenir Next", sans-serif;
        background:
          radial-gradient(circle at 8% 12%, #fff8 0%, #fff0 44%),
          radial-gradient(circle at 85% 92%, #d5f1ff 0%, #d5f1ff00 36%),
          linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 58%, #bfd6e3 100%);
      }

      #app {
        width: min(1280px, 100% - 28px);
        margin: 24px auto;
      }

      .app-shell {
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--card);
        box-shadow: var(--shadow-xl);
        overflow: hidden;
      }

      .top-nav {
        display: flex;
        justify-content: space-between;
        gap: var(--space-3);
        align-items: center;
        padding: 14px 20px;
        background: var(--nav);
        color: var(--nav-ink);
      }

      .brand {
        color: var(--nav-ink);
        font-weight: 800;
        text-decoration: none;
        letter-spacing: 0.2px;
      }

      .top-nav-right {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .top-chip {
        padding: 7px 10px;
        border: 1px solid #f3fbff36;
        border-radius: 999px;
        font-size: 12px;
        color: #dbedf8;
        background: #ffffff10;
      }

      .screen {
        padding: 24px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: #fff;
        box-shadow: var(--shadow-md);
      }

      .panel {
        padding: var(--space-3);
      }

      .eyebrow {
        margin: 0;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      .hero {
        padding: 22px;
        background: linear-gradient(130deg, #f8fdff 0%, #e8f4fa 38%, #e3edf4 100%);
      }

      h1,
      h2,
      h3 {
        margin: 0;
      }

      .hero h1,
      .section-head h1,
      .coming-soon h1 {
        margin-top: 8px;
        font-family: "Alfa Slab One", serif;
        letter-spacing: 0.01em;
      }

      .hero h1 {
        font-size: clamp(2rem, 3.8vw, 3rem);
      }

      .hero p,
      .section-head p,
      .game-subtitle,
      .release-tag,
      .hint,
      .status {
        color: var(--ink-soft);
      }

      .release-tag {
        margin: -4px 0 0;
        font-size: 12px;
        font-weight: 700;
      }

      .game-hub {
        display: grid;
        gap: var(--space-4);
      }

      .game-grid {
        display: grid;
        gap: var(--space-3);
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .game-card {
        padding: 18px;
        display: grid;
        gap: 12px;
      }

      .game-card-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }

      .status-pill {
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .status-live {
        color: #084f2f;
        background: #d2f9e6;
      }

      .status-soon {
        color: #8b5f10;
        background: #ffeec8;
      }

      .meta-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .meta-list span {
        font-size: 12px;
        padding: 5px 9px;
        border-radius: 999px;
        border: 1px solid #d6e5ef;
        color: #355162;
        background: #f7fcff;
      }

      .is-disabled {
        opacity: 0.82;
      }

      .section-head {
        margin-bottom: var(--space-3);
      }

      .section-head p {
        margin: 8px 0 0;
      }

      .btn {
        border: 0;
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      }

      .btn:focus-visible {
        outline: 2px solid #ffd76a;
        outline-offset: 2px;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-primary {
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
        color: #fff;
        box-shadow: 0 8px 18px #0f7aa738;
      }

      .btn-secondary {
        background: var(--secondary);
        color: #11364a;
      }

      .btn-ghost {
        background: #eef5fa;
        color: #1e4359;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .btn:disabled,
      .btn[aria-disabled="true"] {
        opacity: 0.55;
        cursor: not-allowed;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 10px;
        font: inherit;
      }

      .row-actions,
      .fleet-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .join-panel {
        display: grid;
        gap: 10px;
        max-width: 540px;
      }

      .setup-layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 12px;
      }

      .fleet-panel,
      .setup-editor,
      .log-panel,
      .debug-panel {
        display: grid;
        gap: 10px;
      }

      .fleet-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border: 1px solid #ecf3f9;
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        width: 100%;
      }

      .fleet-button.active {
        border-color: #7bc8f3;
        background: #eaf7ff;
      }

      .fleet-row strong {
        margin-left: auto;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .fleet-row img {
        width: 76px;
        height: 24px;
        object-fit: contain;
      }

      .placement-board {
        margin-top: 4px;
        position: relative;
        width: min(100%, 500px);
        aspect-ratio: 1 / 1;
      }

      .placement-grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 4px;
      }

      .placement-ships-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .placement-cell {
        width: 100%;
        aspect-ratio: 1 / 1;
        padding: 0;
        border-radius: 7px;
        border: 1px solid #8aabc4;
        background: #fff;
      }

      .placement-cell.selected-anchor {
        outline: 2px solid #ffd166;
      }

      .placement-cell.occupied {
        box-shadow: inset 0 0 0 1px #2b5878;
      }

      .placement-cell.selected-cell {
        background: #fff4c7;
      }

      .placement-ship {
        position: absolute;
        left: calc((100% / 10) * var(--ship-col));
        top: calc((100% / 10) * var(--ship-row));
        width: calc((100% / 10) * var(--ship-width));
        height: calc((100% / 10) * var(--ship-height));
        filter: drop-shadow(0 2px 3px #22394a66);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .placement-ship img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        transform: rotate(var(--ship-rotation));
        transform-origin: center center;
        display: block;
      }

      .placement-ship.selected {
        filter: drop-shadow(0 0 0 #0000) drop-shadow(0 0 8px #ffd166);
      }

      .gameplay-screen {
        display: grid;
        grid-template-columns: 1.45fr 1fr;
        gap: 12px;
      }

      .board-panel {
        background: linear-gradient(180deg, #f8fdff 0%, #eef7ff 100%);
      }

      .side-stack {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .board-root {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .board-meta {
        font-size: 13px;
        color: var(--ink-soft);
      }

      .board-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .board-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 2px;
        width: 100%;
        max-width: 360px;
      }

      .cell {
        width: 100%;
        aspect-ratio: 1 / 1;
        border: 1px solid #8aabc4;
        border-radius: 3px;
        background: #a9d9f6;
      }

      .cell.water {
        background: #a9d9f6;
      }

      .cell.ship {
        background: #496278;
      }

      .cell.taken-hit,
      .cell.attack-hit {
        background: var(--danger);
      }

      .cell.attack-miss {
        background: #6c8293;
      }

      .opponent-cell {
        cursor: crosshair;
      }

      .opponent-cell:hover {
        outline: 2px solid #ffd166;
      }

      .debug-panel pre,
      .log-panel pre {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        font-family: "Manrope", monospace;
        white-space: pre-wrap;
      }

      .labyrinth-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }

      .labyrinth-cell {
        min-height: 72px;
        border-radius: 8px;
        border: 1px solid #7d654a;
        background: #f7edd8;
        color: #3d2e1d;
        display: grid;
        gap: 4px;
        align-content: center;
        font-size: 10px;
        padding: 4px;
      }

      .labyrinth-cell.reachable {
        outline: 2px solid #2f8f62;
      }

      .tile-openings {
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .tile-obj,
      .tile-players {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .coming-soon {
        max-width: 760px;
      }

      .coming-soon .panel {
        display: grid;
        gap: 12px;
      }

      @media (max-width: 980px) {
        .game-grid,
        .setup-layout,
        .gameplay-screen,
        .board-columns {
          grid-template-columns: 1fr;
        }

        .top-nav {
          align-items: flex-start;
          flex-direction: column;
        }

        .top-nav-right {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
