<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Game Sim</title>
    <style>
      :root {
        font-family: "IBM Plex Sans", "Avenir Next", sans-serif;
      }

      body {
        margin: 0;
        background: linear-gradient(160deg, #ecf7ff 0%, #f8fcff 35%, #e8f1fb 100%);
        min-height: 100vh;
      }

      #app {
        max-width: 960px;
        margin: 24px auto;
        padding: 16px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid #d9e5f2;
        border-radius: 14px;
      }

      input,
      textarea,
      button {
        margin: 6px;
        padding: 8px;
      }

      button {
        border-radius: 8px;
        border: 1px solid #1f4e79;
        background: #1f4e79;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
